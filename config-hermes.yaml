model:
  default: gpt-oss:120b
  provider: ollama-cloud
  base_url: https://ollama.com/v1
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  service_tier: ""
  fast_auto_seconds: 60
  verbose: false
  reasoning_effort: high
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 300
  home_mode: auto
  container_cpu: 2
  container_memory: 8192
  container_disk: 100000
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 600
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.15
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: pt
  local:
    model: base
  openai:
    model: whisper-1
    language: pt
memory:
  provider: honcho
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 8000
  user_char_limit: 3000
  nudge_interval: 10
delegation:
  max_iterations: 250
  max_concurrent_children: 5
  max_spawn_depth: 3
  orchestrator_enabled: true
skills:
  creation_nudge_interval: 15
  write_approval: false
  guard_agent_created: false
plugins:
  enabled:
    - opencode
    - orca-status
    - rtk-rewrite
  disabled: []
  entries:
    opencode:
      allow_tool_override: false
cron:
  catch_up_missed: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
web:
  search_backend: searxng
  extract_backend: firecrawl
  keyless_fallback: true
  keyless_rescue: true
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30
  loop_watchdog_probe_timeout_s: 10
  loop_watchdog_max_strikes: 3
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: false
  auto_migrate: true
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_timeout: 5
  tirith_fail_open: true
_config_version: 44
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
mcp_servers:
  linear:
    url: https://mcp.linear.app/mcp
    headers:
      Authorization: Bearer ${LINEAR_API_KEY}
    connect_timeout: 60
